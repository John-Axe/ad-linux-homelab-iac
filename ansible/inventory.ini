# Static inventory for the lab's Linux server fleet (VLAN 10 — Server/Infra,
# 10.10.10.0/24), matching the IPs assigned to each box's private_network
# adapter in the Vagrantfile and the roles they stand in for in the
# reference topology (it-helpdesk-sysadmin-portfolio/network-lab/topology.md).
#
# When run via `vagrant provision` these hosts are reachable over the
# Vagrant-managed SSH config; ansible_host below is the private-network IP
# each box gets, used when running ansible-playbook directly against
# already-up VMs (e.g. `ansible-playbook -i inventory.ini site.yml`).

[dbservers]
db01 ansible_host=10.10.10.20 lab_role=database

[webservers]
web02 ansible_host=10.10.10.21 lab_role=web

[fileservers]
files01 ansible_host=10.10.10.22 lab_role=fileserver

[linux_servers:children]
dbservers
webservers
fileservers

[linux_servers:vars]
ansible_user=vagrant
ansible_python_interpreter=/usr/bin/python3
